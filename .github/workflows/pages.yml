name: GitHub Pages

# Publie sur la même Page :
#   - la racine (/) : la branche main
#   - /games/       : les jeux Zajko Run et Zajko Quest en HTML/JS (dossier web-games/ de main),
#                     fichiers statiques copiés tels quels
# Déclenché par un push sur main, ou manuellement.
#
# Le site publie aussi une petite API statique sous api/ (index.json,
# sheets/<id>.json, exercises/<id>.json), générée par src/export_api.py du moteur,
# pour les clients légers (app de la montre T-Watch, widgets...).
# Tant que le moteur utilisé n'a pas ce script, l'étape est ignorée (avertissement)
# et le reste du site est publié normalement.

on:
  push:
    branches: [main]
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      slovingo_ref:
        description: "Branche/tag/commit du moteur Slovingo à utiliser"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contenu (main)
        uses: actions/checkout@v5
        with:
          ref: main
          path: content

      - name: Checkout moteur (Slovingo)
        uses: actions/checkout@v5
        with:
          repository: lstux/Slovingo
          ref: ${{ inputs.slovingo_ref || 'main' }}
          path: engine

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Dépendances (Pillow, pour les icônes)
        run: python3 -m pip install -r engine/requirements.txt

      - name: Placer les contenus au format attendu par build.py
        run: |
          mkdir -p engine/langs/sk-fr-friends
          tar --exclude=.git --exclude=.github --exclude=LICENSE --exclude='README*' \
            --exclude=./esp32 --exclude=./web-games \
            -cf - -C content . | tar -xf - -C engine/langs/sk-fr-friends

      - name: Adapter url_path (sans toucher au repo)
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          repo = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          p = pathlib.Path("engine/langs/sk-fr-friends/lang.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg["site"]["url_path"] = f"/{repo}/"
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2), encoding="utf-8")
          print("url_path =", cfg["site"]["url_path"])
          PY

      - name: Build
        run: |
          cd engine
          python3 src/build.py --lang-dir langs/sk-fr-friends --static-dir static

      - name: Export de l'API JSON légère (api/)
        run: |
          cd engine
          if [ -f src/export_api.py ]; then
            python3 src/export_api.py --lang-dir langs/sk-fr-friends -o langs/sk-fr-friends/dist/api
          else
            echo "::warning title=API non publiée::src/export_api.py absent du moteur ${{ inputs.slovingo_ref || 'main' }} (branche feat/t-watch pas encore fusionnée ?)"
          fi

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Préparer l'artefact Pages
        run: |
          mkdir -p _site
          cp -r engine/langs/sk-fr-friends/dist/. _site/
          # les jeux web (pages et donnees, sans les outils ni les tests)
          if [ -d content/web-games ]; then
            mkdir -p _site/games
            cp -r content/web-games/index.html content/web-games/common content/web-games/img content/web-games/zajko-run \
              content/web-games/zajko-quest _site/games/
          fi
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
