<rect x="245" y="400" width="80" height="100" rx="8" fill="#f2c82a" stroke="#a07c0c" stroke-width="4"/>
<rect x="262" y="430" width="46" height="8" fill="#2a2a2a"/><circle cx="285" cy="470" r="8" fill="#6a5a10"/>
